      &lt;desc id=&quot;thought-relativity-desc&quot;&gt;球対称・非回転・無電荷の重力源の外側で、一定の半径に静止させた時計を、無限遠の基準時計と比べます。近くの時計の経過時間は、基準の経過時間に1から質量の相対量uを引いた平方根を掛けた値です。近くでも自分の時計は通常どおりに進みます。質量の操作は別の静的な条件で比較をやり直します。時計の針は一周10秒の目盛です。&lt;/desc&gt;
      &lt;g id=&quot;thought-relativity-drawing&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption class=&quot;thought-rule text-small text-muted&quot;&gt;近くでも、自分の時計は通常どおり&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;figure class=&quot;thought-field&quot; id=&quot;thought-reaction-field&quot; hidden&gt;
    &lt;div class=&quot;text-small&quot;&gt;矢印：同じ大きさ・逆向きの力&lt;/div&gt;
    &lt;svg class=&quot;thought-svg&quot; id=&quot;thought-stage&quot; role=&quot;img&quot; aria-labelledby=&quot;thought-svg-title thought-svg-desc&quot;&gt;
      &lt;title id=&quot;thought-svg-title&quot;&gt;作用と反作用で動く二つの物体&lt;/title&gt;
      &lt;desc id=&quot;thought-svg-desc&quot;&gt;左向きと右向きに、等しい大きさの力が短く働きます。質量が大きい物体の加速度は小さくなります。&lt;/desc&gt;
      &lt;defs&gt;&lt;marker id=&quot;thought-arrow&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;8&quot; markerHeight=&quot;8&quot; orient=&quot;auto-start-reverse&quot; markerUnits=&quot;userSpaceOnUse&quot;&gt;&lt;path d=&quot;M0,0 L8,4 L0,8 Z&quot; fill=&quot;var(--viz-series-1)&quot;&gt;&lt;/path&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;g id=&quot;thought-drawing&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;p class=&quot;thought-result tabular-nums&quot; id=&quot;thought-result&quot;&gt;同じ情報粒子から、単独と隣に収集者がいる場合を比べる&lt;/p&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;thought-physics-preview&#x27;);
      if (!root) return;
      const find = id =&gt; root.querySelector(&#x27;#thought-&#x27; + id);
      const controls = {
        scene: find(&#x27;scene&#x27;), strength: find(&#x27;strength&#x27;), rightMass: find(&#x27;mass&#x27;),
        nearby: find(&#x27;nearby&#x27;), sharing: find(&#x27;sharing&#x27;), growth: find(&#x27;growth&#x27;), compactness: find(&#x27;compactness&#x27;)
      };
      const result = find(&#x27;result&#x27;);
      const status = find(&#x27;status&#x27;);
      const runButton = find(&#x27;run&#x27;);
      const reducedMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
      const svgNS = &#x27;http://www.w3.org/2000/svg&#x27;;
      const fixedStep = 1 / 120;
      const particleCount = 72;
      const worldWidth = 400;
      const worldHeight = 240;
      const learnerCenter = { x: 145, y: 135, base: 1 };
      const collectorCenter = { x: 300, y: 100, base: 3.8 };
      const captureRadius = 15;
      const softening = 20;
      const gravityConstant = 110000;
      const sharingDelay = 0.48;
      const collectionDuration = 6;
      const growthLimit = 2.8;
      const growthInformationScale = 48;
      const referenceInterval = 10;
      const overviewPreset = Object.freeze({ strength: 1, nearby: true, sharing: true, growth: true, compactness: 0.6 });
      const validScenes = [&#x27;overview&#x27;, &#x27;gravity&#x27;, &#x27;relativity&#x27;, &#x27;reaction&#x27;];
      const initialScene = normalizeScene(root.dataset.startScene) || &#x27;gravity&#x27;;
      let choices = { scene: initialScene, strength: 1, rightMass: 2, nearby: true, sharing: true, growth: true, compactness: 0.6 };
      let worlds = [];
      let reactionNodes = null;
      let relativityNodes = null;
      let overviewNodes = null;
      let elapsed = 0;
      let running = false;
      let phase = &#x27;ready&#x27;;
      let animation = 0;
      let lastFrame = 0;
      let pendingStep = 0;
      let measuredWidth = 0;
      const dimensions = { alone: 320, near: 320, reaction: 640, relativity: 640, overview: 640 };

      function make(parent, name, attrs = {}) {
        const node = document.createElementNS(svgNS, name);
        Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, String(value)));
        parent.appendChild(node);
        return node;
      }
      function text(parent, value, x, y, anchor = &#x27;middle&#x27;) {
        const node = make(parent, &#x27;text&#x27;, { x, y, &#x27;text-anchor&#x27;: anchor });
        node.textContent = value;
        return node;
      }
      function stateKey() { return JSON.stringify(choices); }
      function normalizeScene(value) {
        if (value === &#x27;time&#x27;) return &#x27;overview&#x27;;
        return validScenes.includes(value) ? value : null;
      }
      function informationSettings() { return choices.scene === &#x27;overview&#x27; ? overviewPreset : choices; }
      function duration() { return choices.scene === &#x27;overview&#x27; || choices.scene === &#x27;gravity&#x27; ? collectionDuration + 0.5 : choices.scene === &#x27;relativity&#x27; ? 6 : 3; }
      function persist() {
        if (typeof window.openai?.setWidgetState !== &#x27;function&#x27;) return;
        const names = { overview: &#x27;思考と重力・情報収集と二つの時計&#x27;, gravity: &#x27;情報収集・共有・蓄積&#x27;, relativity: &#x27;重力と時間の尺度&#x27;, reaction: &#x27;作用反作用&#x27; };
        const active = choices.scene === &#x27;overview&#x27; ? overviewPreset : choices;
        // Inline and exported hosts may return void or a Promise respectively.
        Promise.resolve(window.openai.setWidgetState({
          modelContent: { scene: names[choices.scene], attractionMultiplier: active.strength, nearbyCollector: active.nearby, sharingCopies: active.sharing, accumulationGrowth: active.growth, gravitationalCompactness: active.compactness, ...(choices.scene === &#x27;overview&#x27; ? {} : { rightToLeftMassRatio: choices.rightMass }) },
          privateContent: { ...choices }
        })).catch(() =&gt; {});
      }
      function stop() {
        running = false;
        cancelAnimationFrame(animation);
        animation = 0;
      }
      function configure() {
        Object.entries(controls).forEach(([key, control]) =&gt; {
          if (control.type === &#x27;checkbox&#x27;) control.checked = choices[key];
          else control.value = String(choices[key]);
        });
        find(&#x27;strength-value&#x27;).textContent = choices.strength.toFixed(1) + &#x27;×&#x27;;
        find(&#x27;header-subtitle&#x27;).hidden = choices.scene === &#x27;overview&#x27;;
        find(&#x27;compactness-value&#x27;).textContent = &#x27;相対量 &#x27; + choices.compactness.toFixed(2);
        controls.compactness.setAttribute(&#x27;aria-valuetext&#x27;, &#x27;質量の相対量 &#x27; + choices.compactness.toFixed(2) + &#x27;、近くの時計の進み &#x27; + (Math.sqrt(1 - choices.compactness) * 100).toFixed(1) + &#x27;パーセント&#x27;);
        find(&#x27;gravity-controls&#x27;).hidden = choices.scene !== &#x27;gravity&#x27;;
        find(&#x27;information-controls&#x27;).hidden = choices.scene !== &#x27;gravity&#x27;;
        find(&#x27;relativity-controls&#x27;).hidden = choices.scene !== &#x27;relativity&#x27;;
        find(&#x27;reaction-controls&#x27;).hidden = choices.scene !== &#x27;reaction&#x27;;
        validScenes.forEach(name =&gt; { find(name + &#x27;-field&#x27;).hidden = choices.scene !== name; });
        controls.sharing.disabled = !choices.nearby;
        find(&#x27;near-heading&#x27;).textContent = choices.nearby ? &#x27;強い収集者のそばで集める&#x27; : &#x27;隣の収集者なし&#x27;;
        find(&#x27;information-rule&#x27;).textContent = choices.nearby &amp;&amp; !choices.sharing
          ? &#x27;共有なし：隣の引力は、同じ粒子を奪い合う場合もある&#x27;
          : &#x27;同じ初期粒子で比較・共有と蓄積による成長は追加ルール&#x27;;
      }
      function growthMultiplier(known) {
        return informationSettings().growth ? 1 + (growthLimit - 1) * Math.min(known.size / growthInformationScale, 1) : 1;
      }
      function effectiveMass(world, owner) {
        return owner === &#x27;learner&#x27;
          ? learnerCenter.base * informationSettings().strength * growthMultiplier(world.known)
          : collectorCenter.base * growthMultiplier(world.collector);
      }
      function createWorld(neighbor) {
        let seed = 38123;
        const random = () =&gt; {
          seed = (Math.imul(seed, 1664525) + 1013904223) &gt;&gt;&gt; 0;
          return seed / 4294967296;
        };
        const particles = Array.from({ length: particleCount }, (_, id) =&gt; {
          let x = 18 + random() * (worldWidth - 36);
          let y = 16 + random() * (worldHeight - 32);
          // Both comparison worlds use the same exclusion zones and seed.
          for (const center of [learnerCenter, collectorCenter]) {
            if (Math.hypot(x - center.x, y - center.y) &lt; 36) {
              const angle = random() * Math.PI * 2;
              x = center.x + Math.cos(angle) * 38;
              y = center.y + Math.sin(angle) * 38;
            }
          }
          return { id, x, y, vx: 0, vy: 0, owner: null, trail: [[x, y]] };
        });
        return { neighbor, particles, own: new Set(), received: new Set(), known: new Set(), collector: new Set(), copies: [], nodes: null };
      }
      function fieldNodes(parent, owner) {
        const group = make(parent, &#x27;g&#x27;, { &#x27;data-center&#x27;: owner });
        const rings = [1, 1.5, 2].map((scale, index) =&gt; make(group, &#x27;ellipse&#x27;, { fill: index === 0 ? &#x27;var(--viz-series-1)&#x27; : &#x27;none&#x27;, &#x27;fill-opacity&#x27;: 0.07, stroke: &#x27;var(--viz-series-1)&#x27;, &#x27;stroke-opacity&#x27;: 0.12, &#x27;stroke-width&#x27;: 1, &#x27;data-ring&#x27;: scale }));
        const center = make(group, &#x27;circle&#x27;, { r: 11, fill: &#x27;var(--viz-series-1)&#x27;, &#x27;fill-opacity&#x27;: owner === &#x27;learner&#x27; ? 0.65 : 0.3 });
        return { group, rings, center };
      }
      function buildGravity() {
        find(&#x27;alone-drawing&#x27;).replaceChildren();
        find(&#x27;near-drawing&#x27;).replaceChildren();
        worlds.forEach((world, index) =&gt; {
          const name = index === 0 ? &#x27;alone&#x27; : &#x27;near&#x27;;
          const drawing = choices.scene === &#x27;overview&#x27; &amp;&amp; index === 1 ? overviewNodes.information : find(name + &#x27;-drawing&#x27;);
          drawing.replaceChildren();
          const connector = make(drawing, &#x27;line&#x27;, { stroke: &#x27;var(--viz-series-2)&#x27;, &#x27;stroke-opacity&#x27;: 0.6, &#x27;stroke-width&#x27;: 1.5, &#x27;stroke-dasharray&#x27;: &#x27;4 5&#x27;, &#x27;data-sharing-path&#x27;: name });
          const trails = world.particles.map(p =&gt; make(drawing, &#x27;polyline&#x27;, { fill: &#x27;none&#x27;, stroke: &#x27;var(--foreground)&#x27;, &#x27;stroke-opacity&#x27;: 0.16, &#x27;stroke-width&#x27;: 1, &#x27;data-trail&#x27;: p.id }));
          const learner = fieldNodes(drawing, &#x27;learner&#x27;);
          const collector = world.neighbor ? fieldNodes(drawing, &#x27;collector&#x27;) : null;
          const particles = world.particles.map(p =&gt; make(drawing, &#x27;circle&#x27;, { r: 2.5, fill: &#x27;var(--foreground)&#x27;, &#x27;fill-opacity&#x27;: 0.55, &#x27;data-particle&#x27;: p.id }));
          const copies = make(drawing, &#x27;g&#x27;, { fill: &#x27;var(--viz-series-2)&#x27;, &#x27;data-copy-layer&#x27;: name });
          const learnerLabel = text(drawing, &#x27;学ぶ人&#x27;, 0, 0);
          const collectorLabel = world.neighbor ? text(drawing, &#x27;収集者&#x27;, 0, 0) : null;
          world.nodes = { drawing, connector, learner, collector, trails, particles, copies, learnerLabel, collectorLabel };
        });
      }
      function setView(name, svg, height) {
        const width = Math.max(120, Math.round(svg.getBoundingClientRect().width) || dimensions[name]);
        dimensions[name] = width;
        svg.setAttribute(&#x27;viewBox&#x27;, &#x27;0 0 &#x27; + width + &#x27; &#x27; + height);
        svg.setAttribute(&#x27;height&#x27;, height);
      }
      function buildReaction() {
        const drawing = find(&#x27;drawing&#x27;);
        drawing.replaceChildren();
        const width = dimensions.reaction;
        const height = width &lt; 420 ? 250 : 272;
        make(drawing, &#x27;line&#x27;, { x1: 22, x2: width - 22, y1: height / 2, y2: height / 2, stroke: &#x27;var(--border)&#x27;, &#x27;stroke-width&#x27;: 1 });
        const left = make(drawing, &#x27;circle&#x27;, { r: 14, cy: height / 2, fill: &#x27;var(--viz-series-1)&#x27;, &#x27;fill-opacity&#x27;: 0.35, &#x27;data-body&#x27;: &#x27;left&#x27; });
        const right = make(drawing, &#x27;circle&#x27;, { r: choices.rightMass === 1 ? 14 : 20, cy: height / 2, fill: &#x27;var(--viz-series-1)&#x27;, &#x27;fill-opacity&#x27;: 0.35, &#x27;data-body&#x27;: &#x27;right&#x27; });
        const arrow = side =&gt; make(drawing, &#x27;line&#x27;, { y1: height / 2, y2: height / 2, stroke: &#x27;var(--viz-series-1)&#x27;, &#x27;stroke-width&#x27;: 2, &#x27;marker-end&#x27;: &#x27;url(#thought-arrow)&#x27;, &#x27;data-force&#x27;: side });
        reactionNodes = { left, right, leftArrow: arrow(&#x27;left&#x27;), rightArrow: arrow(&#x27;right&#x27;), leftLabel: text(drawing, &#x27;左：質量 1&#x27;, 0, height / 2 + 52), rightLabel: text(drawing, &#x27;右：質量 &#x27; + choices.rightMass, 0, height / 2 + 52) };
        text(drawing, &#x27;力を短く加える&#x27;, width / 2, 42);
      }
      function buildRelativity() {
        const drawing = find(&#x27;relativity-drawing&#x27;);
        drawing.replaceChildren();
        const width = dimensions.relativity;
        const left = 16;
        const right = width - 16;
        const span = right - left;
        const rate = Math.sqrt(1 - choices.compactness);
        const clocks = {};
        for (const [name, cx, caption] of [[&#x27;reference&#x27;, width * 0.25, &#x27;無限遠の基準時計&#x27;], [&#x27;local&#x27;, width * 0.75, &#x27;近くで静止&#x27;]]) {
          text(drawing, caption, cx, 18);
          make(drawing, &#x27;circle&#x27;, { cx, cy: 67, r: 31, fill: &#x27;none&#x27;, stroke: &#x27;var(--border)&#x27;, &#x27;stroke-width&#x27;: 1 });
          for (let tick = 0; tick &lt; 10; tick++) {
            const angle = tick * Math.PI / 5 - Math.PI / 2;
            make(drawing, &#x27;line&#x27;, { x1: cx + Math.cos(angle) * 27, y1: 67 + Math.sin(angle) * 27, x2: cx + Math.cos(angle) * 31, y2: 67 + Math.sin(angle) * 31, stroke: &#x27;var(--muted-foreground)&#x27;, &#x27;stroke-width&#x27;: 1 });
          }
          const hand = make(drawing, &#x27;line&#x27;, { x1: cx, y1: 67, x2: cx, y2: 43, stroke: name === &#x27;reference&#x27; ? &#x27;var(--foreground)&#x27; : &#x27;var(--viz-series-1)&#x27;, &#x27;stroke-width&#x27;: 2, &#x27;data-relativity-hand&#x27;: name });
          make(drawing, &#x27;circle&#x27;, { cx, cy: 67, r: 3, fill: name === &#x27;reference&#x27; ? &#x27;var(--foreground)&#x27; : &#x27;var(--viz-series-1)&#x27; });
          const reading = text(drawing, &#x27;0.00秒&#x27;, cx, 120);
          reading.setAttribute(&#x27;id&#x27;, &#x27;thought-relativity-&#x27; + name + &#x27;-reading&#x27;);
          clocks[name] = { hand, reading, cx };
        }
        text(drawing, &#x27;針の目盛：1周10秒&#x27;, width / 2, 143);
        const elapsedBars = {};
        for (const [name, y, interval, caption] of [[&#x27;reference&#x27;, 184, referenceInterval, &#x27;基準&#x27;], [&#x27;local&#x27;, 254, referenceInterval * rate, &#x27;近く&#x27;]]) {
          text(drawing, caption + &#x27;：&#x27; + interval.toFixed(2) + &#x27;秒&#x27;, left, y - 12, &#x27;start&#x27;);
          make(drawing, &#x27;rect&#x27;, { x: left, y, width: span, height: 12, rx: 3, fill: &#x27;var(--muted)&#x27; });
          make(drawing, &#x27;rect&#x27;, { x: left, y, width: span * interval / referenceInterval, height: 12, rx: 3, fill: name === &#x27;reference&#x27; ? &#x27;var(--foreground)&#x27; : &#x27;var(--viz-series-1)&#x27;, &#x27;fill-opacity&#x27;: 0.2, &#x27;data-relativity-ruler&#x27;: name });
          elapsedBars[name] = make(drawing, &#x27;rect&#x27;, { x: left, y, width: 0, height: 12, rx: 3, fill: name === &#x27;reference&#x27; ? &#x27;var(--foreground)&#x27; : &#x27;var(--viz-series-1)&#x27;, &#x27;fill-opacity&#x27;: 0.65, &#x27;data-relativity-elapsed&#x27;: name });
          text(drawing, &#x27;0秒&#x27;, left, y + 32, &#x27;start&#x27;);
          text(drawing, &#x27;10秒の尺度&#x27;, right, y + 32, &#x27;end&#x27;);
        }
        relativityNodes = { clocks, elapsedBars, span, rate };

      }
      function buildOverview() {
        const drawing = find(&#x27;overview-drawing&#x27;);
        drawing.replaceChildren();
        const width = dimensions.overview;
        const information = make(drawing, &#x27;g&#x27;, { &#x27;data-story-information&#x27;: &#x27;true&#x27; });
        const informationLabel = text(drawing, &#x27;自分で0 ＋ 共有0&#x27;, 16, 50, &#x27;start&#x27;);
        text(drawing, &#x27;共有&#x27;, (learnerCenter.x + collectorCenter.x) / (2 * worldWidth) * width, 103);
        const clocks = {};
        const clockY = 332;
        const clockLeft = width &lt; 500 ? width * 0.28 : 62;
        const clockRight = width &lt; 500 ? width * 0.72 : 174;
        text(drawing, &#x27;同じ受信区間・1周10秒&#x27;, 16, clockY - 54, &#x27;start&#x27;);
        for (const [name, cx, caption] of [[&#x27;reference&#x27;, clockLeft, &#x27;外の時計&#x27;], [&#x27;local&#x27;, clockRight, &#x27;手元の時計&#x27;]]) {
          text(drawing, caption, cx, clockY - 28);
          make(drawing, &#x27;circle&#x27;, { cx, cy: clockY, r: 20, fill: &#x27;none&#x27;, stroke: &#x27;var(--border)&#x27;, &#x27;stroke-width&#x27;: 1 });
          const hand = make(drawing, &#x27;line&#x27;, { x1: cx, y1: clockY, x2: cx, y2: clockY - 16, stroke: name === &#x27;reference&#x27; ? &#x27;var(--foreground)&#x27; : &#x27;var(--viz-series-1)&#x27;, &#x27;stroke-width&#x27;: 2, &#x27;data-story-clock&#x27;: name });
          const reading = text(drawing, &#x27;0.00秒&#x27;, cx, clockY + 42);
          const ruler = make(drawing, &#x27;rect&#x27;, { x: cx - 38, y: clockY + 52, width: 0, height: 5, rx: 2, fill: name === &#x27;reference&#x27; ? &#x27;var(--foreground)&#x27; : &#x27;var(--viz-series-1)&#x27;, &#x27;data-story-clock-ruler&#x27;: name });
          clocks[name] = { cx, hand, reading, ruler };
        }
        overviewNodes = { information, informationLabel, clocks, clockY };
      }
      function reset() {
        stop();
        elapsed = 0;
        pendingStep = 0;
        phase = &#x27;ready&#x27;;
        configure();
        worlds = [createWorld(false), createWorld(informationSettings().nearby)];
        measure();
        buildOverview();
        buildGravity();
        buildReaction();
        buildRelativity();
        draw();
        runButton.textContent = &#x27;動きを見る&#x27;;
        status.textContent = &#x27;開始前&#x27;;
      }
      function measure() {
        setView(&#x27;alone&#x27;, find(&#x27;alone-stage&#x27;), worldHeight);
        setView(&#x27;near&#x27;, find(&#x27;near-stage&#x27;), worldHeight);
        setView(&#x27;relativity&#x27;, find(&#x27;relativity-stage&#x27;), 302);
        const fullWidth = Math.max(120, Math.round(root.getBoundingClientRect().width) || 640);
        dimensions.overview = fullWidth;
        find(&#x27;overview-stage&#x27;).setAttribute(&#x27;viewBox&#x27;, &#x27;0 0 &#x27; + fullWidth + &#x27; 400&#x27;);
        find(&#x27;overview-stage&#x27;).setAttribute(&#x27;height&#x27;, 400);
        if (choices.scene === &#x27;overview&#x27;) dimensions.near = fullWidth;
        dimensions.reaction = fullWidth;
        find(&#x27;stage&#x27;).setAttribute(&#x27;viewBox&#x27;, &#x27;0 0 &#x27; + fullWidth + &#x27; &#x27; + (fullWidth &lt; 420 ? 250 : 272));
        find(&#x27;stage&#x27;).setAttribute(&#x27;height&#x27;, fullWidth &lt; 420 ? 250 : 272);
      }
      function acceleration(world, x, y) {
        let ax = 0;
        let ay = 0;
        const centers = world.neighbor ? [[&#x27;learner&#x27;, learnerCenter], [&#x27;collector&#x27;, collectorCenter]] : [[&#x27;learner&#x27;, learnerCenter]];
        for (const [owner, center] of centers) {
          const dx = center.x - x;
          const dy = center.y - y;
          const softenedSquare = dx * dx + dy * dy + softening * softening;
          const factor = gravityConstant * effectiveMass(world, owner) / Math.pow(softenedSquare, 1.5);
          ax += dx * factor;
          ay += dy * factor;
        }
        return { x: ax, y: ay };
      }
      function crossingFraction(p, x, y, center) {
        const dx = x - p.x;
        const dy = y - p.y;
        const ox = p.x - center.x;
        const oy = p.y - center.y;
        const a = dx * dx + dy * dy;
        const c = ox * ox + oy * oy - captureRadius * captureRadius;
        if (c &lt;= 0) return 0;
        if (a === 0) return Infinity;
        const b = 2 * (ox * dx + oy * dy);
        const discriminant = b * b - 4 * a * c;
        if (discriminant &lt; 0) return Infinity;
        const first = (-b - Math.sqrt(discriminant)) / (2 * a);
