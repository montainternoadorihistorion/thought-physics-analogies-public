<div id="thought-physics-preview" data-start-scene="overview">
  <style>
    #thought-physics-preview .thought-header { padding-right: 96px; margin-bottom: 12px; word-break: keep-all; }
    #thought-physics-preview h3 { margin: 0 0 4px; }
    #thought-physics-preview .thought-field { margin: 12px 0 8px; }
    #thought-physics-preview .thought-svg { display: block; width: 100%; color: var(--foreground); overflow: hidden; }
    #thought-physics-preview .thought-svg text { fill: var(--foreground); font-size: var(--font-size-base); font-weight: 400; }
    #thought-physics-preview .thought-worlds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    #thought-physics-preview .thought-world { min-width: 0; }
    #thought-physics-preview .thought-world-heading { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; }
    #thought-physics-preview .thought-counts { display: flex; flex-wrap: wrap; gap: 4px 12px; }
    #thought-physics-preview .thought-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 8px; }
    #thought-physics-preview .thought-swatch { display: inline-block; width: 8px; height: 8px; margin-right: 5px; background: var(--viz-series-1); border-radius: 50%; }
    #thought-physics-preview .thought-swatch-copy { background: var(--viz-series-2); border-radius: 0; transform: rotate(45deg); }
    #thought-physics-preview .thought-swatch-ghost { box-sizing: border-box; background: none; border: 1px solid var(--foreground); opacity: 0.6; }
    #thought-physics-preview .thought-checks { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; }
    #thought-physics-preview .thought-result { min-height: 1.5em; margin: 8px 0; }
    #thought-physics-preview .thought-rule { margin-top: 6px; }
    #thought-physics-preview .thought-story-flow { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
    #thought-physics-preview .thought-story-phase { color: var(--muted-foreground); }
    #thought-physics-preview .thought-story-phase[data-active="true"] { color: var(--foreground); font-weight: 500; }
    #thought-physics-preview [hidden] { display: none; }
    @media (max-width: 600px) {
      #thought-physics-preview .thought-worlds { grid-template-columns: minmax(0, 1fr); gap: 20px; }
    }
  </style>
  <div class="thought-header">

    <svg class="thought-svg" id="thought-overview-stage" role="img" aria-labelledby="thought-overview-title thought-overview-desc">
      <title id="thought-overview-title">思考を重力に見立てた情報収集と、同じ受信区間を測る二つの時計</title>
      <desc id="thought-overview-desc">丸い情報粒子は左から右へ一定の速さで流れ、思考の引力で曲がり、近くを通るものが捕捉されます。薄い輪は、思考がなければ通っていた位置です。隣の強い思考から菱形のコピーが共有されます。異なる情報の蓄積に応じて引力が上限まで増し、引き込める幅が広がります。二つの時計は、同じ情報を受け取る同じ区間を測ります。この例では外の時計で10秒、手元の時計で約6.32秒です。短いのは手元の経過時間で、外から見た情報収集の完了が時計の遅れによって早まる計算ではありません。手元でも自分の時計は通常どおり進みます。時計は球対称・非回転・無電荷の重力源の外側に静止させた時計と、無限遠の基準時計の独立した比較です。静的な質量条件uは0.6で固定し、時計の進みの比率は1からuを引いた値の平方根です。情報粒子の経路とコピーは従来の比喩モデルのままで、相対論の粒子や光の軌道を計算していません。比喩モデルの受信区間を外の時計の10秒へ例示的に換算しています。共有と蓄積による成長は追加の仮定です。針は一周10秒です。</desc>
      <g id="thought-overview-drawing"></g>
    </svg>
    <figcaption class="thought-rule text-small text-muted">短いのは手元の経過時間</figcaption>
  </figure>
  <figure class="thought-field" id="thought-gravity-field">
    <div class="thought-legend text-small">
      <span><span class="thought-swatch" aria-hidden="true"></span>丸い点：情報粒子</span>
      <span><span class="thought-swatch thought-swatch-copy" aria-hidden="true"></span>菱形：共有されたコピー</span>
      <span><span class="thought-swatch thought-swatch-ghost" aria-hidden="true"></span>輪：思考がなければ通った位置</span>
    </div>
    <div class="thought-worlds">
      <section class="thought-world" aria-labelledby="thought-alone-heading">
        <div class="thought-world-heading"><span id="thought-alone-heading">学ぶ人が単独で集める</span><span class="tabular-nums" id="thought-alone-total">情報 0点</span></div>
        <svg class="thought-svg" id="thought-alone-stage" role="img" aria-labelledby="thought-alone-title thought-alone-desc">
          <title id="thought-alone-title">単独で情報を集める比喩モデル</title>
          <desc id="thought-alone-desc">左から右へ流れる情報粒子が、固定された中心の引力で曲がり、近くを通るものは捕捉されます。薄い輪は、思考がなければ通っていた位置です。蓄積による成長を有効にすると、得た情報に応じて引力が上限まで増し、引き込める幅が広がります。</desc>
          <g id="thought-alone-drawing"></g>
        </svg>
        <div class="thought-counts text-small tabular-nums"><span id="thought-alone-own">自分で 0</span><span id="thought-alone-growth">引力 1.0×</span></div>
      </section>
      <section class="thought-world" aria-labelledby="thought-near-heading">
        <div class="thought-world-heading"><span id="thought-near-heading">強い収集者のそばで集める</span><span class="tabular-nums" id="thought-near-total">情報 0点</span></div>
        <svg class="thought-svg" id="thought-near-stage" role="img" aria-labelledby="thought-near-title thought-near-desc">
          <title id="thought-near-title">隣の収集者と情報共有を比較する比喩モデル</title>
          <desc id="thought-near-desc">左と同じ情報の流れです。隣の強い中心も粒子を曲げて集めます。共有を有効にすると、その情報のコピーが点線を通って学ぶ人に届きます。共有は引力とは別の追加ルールです。</desc>
          <g id="thought-near-drawing"></g>
        </svg>
        <div class="thought-counts text-small tabular-nums"><span id="thought-near-own">自分で 0</span><span id="thought-near-received">共有 0</span><span id="thought-near-growth">引力 1.0×</span></div>
      </section>
    </div>
    <figcaption class="thought-rule text-small text-muted" id="thought-information-rule">同じ情報の流れで比較・共有と蓄積による成長は追加ルール</figcaption>
  </figure>
  <figure class="thought-field" id="thought-relativity-field" hidden>
    <div class="thought-world-heading"><span id="thought-relativity-heading">物理の時計</span><span class="tabular-nums" id="thought-relativity-rate">近く 63.2%</span></div>
    <div class="text-small text-muted">同じ外部時間を比較</div>
    <svg class="thought-svg" id="thought-relativity-stage" role="img" aria-labelledby="thought-relativity-title thought-relativity-desc">
      <title id="thought-relativity-title">重力による時計の進み方の違い</title>
      <desc id="thought-relativity-desc">球対称・非回転・無電荷の重力源の外側で、一定の半径に静止させた時計を、無限遠の基準時計と比べます。近くの時計の経過時間は、基準の経過時間に1から質量の相対量uを引いた平方根を掛けた値です。近くでも自分の時計は通常どおりに進みます。質量の操作は別の静的な条件で比較をやり直します。時計の針は一周10秒の目盛です。</desc>
      <g id="thought-relativity-drawing"></g>
    </svg>
    <figcaption class="thought-rule text-small text-muted">近くでも、自分の時計は通常どおり</figcaption>
  </figure>
  <figure class="thought-field" id="thought-reaction-field" hidden>
    <div class="text-small">矢印：同じ大きさ・逆向きの力</div>
    <svg class="thought-svg" id="thought-stage" role="img" aria-labelledby="thought-svg-title thought-svg-desc">
      <title id="thought-svg-title">作用と反作用で動く二つの物体</title>
      <desc id="thought-svg-desc">左向きと右向きに、等しい大きさの力が短く働きます。質量が大きい物体の加速度は小さくなります。</desc>
      <defs><marker id="thought-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--viz-series-1)"></path></marker></defs>
      <g id="thought-drawing"></g>
    </svg>
  </figure>
  <p class="thought-result tabular-nums" id="thought-result">同じ情報の流れで、単独と隣に収集者がいる場合を比べる</p>
  <script>
    (() => {
      const root = document.getElementById('thought-physics-preview');
      if (!root) return;
      const find = id => root.querySelector('#thought-' + id);
      const controls = {
        scene: find('scene'), strength: find('strength'), rightMass: find('mass'),
        nearby: find('nearby'), sharing: find('sharing'), growth: find('growth'), compactness: find('compactness')
      };
      const result = find('result');
      const status = find('status');
      const runButton = find('run');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const svgNS = 'http://www.w3.org/2000/svg';
      const fixedStep = 1 / 120;
      const particleCount = 72;
      const worldWidth = 400;
      const worldHeight = 240;
      const learnerCenter = { x: 145, y: 135, base: 1 };
      const collectorCenter = { x: 300, y: 100, base: 3.8 };
      const captureRadius = 15;
      const softening = 20;
      const gravityConstant = 110000;
      const sharingDelay = 0.48;
      const collectionDuration = 6;
      const growthLimit = 2.8;
      const growthInformationScale = 48;
      const referenceInterval = 10;
      // Information drifts left to right; thought bends the stream and captures what passes close enough.
      const streamSpeed = 60;
      const streamSpeedJitter = 0.1;
      const streamSideSpeed = 5;
      const upstreamSpan = streamSpeed * collectionDuration;
      const upstreamCount = Math.round(particleCount * upstreamSpan / worldWidth);
      const ghostVisibleShift = 4;
      const ghostFadeShift = 60;
      const ghostHiddenShift = 120;
      const overviewPreset = Object.freeze({ strength: 1, nearby: true, sharing: true, growth: true, compactness: 0.6 });
      const validScenes = ['overview', 'gravity', 'relativity', 'reaction'];
      const initialScene = normalizeScene(root.dataset.startScene) || 'gravity';
      let choices = { scene: initialScene, strength: 1, rightMass: 2, nearby: true, sharing: true, growth: true, compactness: 0.6 };
      let worlds = [];
      let reactionNodes = null;
      let relativityNodes = null;
      let overviewNodes = null;
      let elapsed = 0;
      let running = false;
      let phase = 'ready';
      let animation = 0;
      let lastFrame = 0;
      let pendingStep = 0;
      let measuredWidth = 0;
      const dimensions = { alone: 320, near: 320, reaction: 640, relativity: 640, overview: 640 };
      // Wide layouts stretch the field sideways; cap it so bent paths keep a recognisable shape.
      const maxStretch = 1.5;
      const offsets = { alone: 0, near: 0 };

      function make(parent, name, attrs = {}) {
        const node = document.createElementNS(svgNS, name);
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, String(value)));
        parent.appendChild(node);
        return node;
      }
      function text(parent, value, x, y, anchor = 'middle') {
        const node = make(parent, 'text', { x, y, 'text-anchor': anchor });
        node.textContent = value;
        return node;
      }
      function stateKey() { return JSON.stringify(choices); }
      function normalizeScene(value) {
        if (value === 'time') return 'overview';
        return validScenes.includes(value) ? value : null;
      }
      function informationSettings() { return choices.scene === 'overview' ? overviewPreset : choices; }
      function duration() { return choices.scene === 'overview' || choices.scene === 'gravity' ? collectionDuration + 0.5 : choices.scene === 'relativity' ? 6 : 3; }
      function persist() {
        if (typeof window.openai?.setWidgetState !== 'function') return;
        const names = { overview: '思考と重力・情報収集と二つの時計', gravity: '情報収集・共有・蓄積', relativity: '重力と時間の尺度', reaction: '作用反作用' };
        const active = choices.scene === 'overview' ? overviewPreset : choices;
        // Inline and exported hosts may return void or a Promise respectively.
        Promise.resolve(window.openai.setWidgetState({
          modelContent: { scene: names[choices.scene], attractionMultiplier: active.strength, nearbyCollector: active.nearby, sharingCopies: active.sharing, accumulationGrowth: active.growth, gravitationalCompactness: active.compactness, ...(choices.scene === 'overview' ? {} : { rightToLeftMassRatio: choices.rightMass }) },
          privateContent: { ...choices }
        })).catch(() => {});
      }
      function stop() {
        running = false;
        cancelAnimationFrame(animation);
        animation = 0;
      }
      function configure() {
        Object.entries(controls).forEach(([key, control]) => {
          if (control.type === 'checkbox') control.checked = choices[key];
          else control.value = String(choices[key]);
        });
        find('strength-value').textContent = choices.strength.toFixed(1) + '×';
        find('header-subtitle').hidden = choices.scene === 'overview';
        find('compactness-value').textContent = '相対量 ' + choices.compactness.toFixed(2);
        controls.compactness.setAttribute('aria-valuetext', '質量の相対量 ' + choices.compactness.toFixed(2) + '、近くの時計の進み ' + (Math.sqrt(1 - choices.compactness) * 100).toFixed(1) + 'パーセント');
        find('gravity-controls').hidden = choices.scene !== 'gravity';
        find('information-controls').hidden = choices.scene !== 'gravity';
        find('relativity-controls').hidden = choices.scene !== 'relativity';
        find('reaction-controls').hidden = choices.scene !== 'reaction';
        validScenes.forEach(name => { find(name + '-field').hidden = choices.scene !== name; });
        controls.sharing.disabled = !choices.nearby;
        find('near-heading').textContent = choices.nearby ? '強い収集者のそばで集める' : '隣の収集者なし';
        find('information-rule').textContent = choices.nearby && !choices.sharing
          ? '共有なし：隣の引力は、同じ粒子を奪い合う場合もある'
          : '同じ情報の流れで比較・共有と蓄積による成長は追加ルール';
      }
      function growthMultiplier(known) {
        return informationSettings().growth ? 1 + (growthLimit - 1) * Math.min(known.size / growthInformationScale, 1) : 1;
      }
      function effectiveMass(world, owner) {
        return owner === 'learner'
          ? learnerCenter.base * informationSettings().strength * growthMultiplier(world.known)
          : collectorCenter.base * growthMultiplier(world.collector);
      }
      function createWorld(neighbor) {
        let seed = 38123;
        const random = () => {
          seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
          return seed / 4294967296;
        };
        const particles = Array.from({ length: particleCount }, (_, id) => {
          let x = 18 + random() * (worldWidth - 36);
          let y = 16 + random() * (worldHeight - 32);
          // Both comparison worlds use the same exclusion zones and seed.
          for (const center of [learnerCenter, collectorCenter]) {
            if (Math.hypot(x - center.x, y - center.y) < 36) {
              const angle = random() * Math.PI * 2;
              x = center.x + Math.cos(angle) * 38;
              y = center.y + Math.sin(angle) * 38;
            }
          }
          return { id, x, y };
        });
        // The stream continues upstream at the same density, so information keeps arriving for the whole run.
        for (let i = 0; i < upstreamCount; i++) particles.push({ id: particleCount + i, x: -random() * upstreamSpan, y: 16 + random() * (worldHeight - 32) });
        for (const p of particles) {
          const vx = streamSpeed * (1 - streamSpeedJitter + 2 * streamSpeedJitter * random());
          const vy = (random() - 0.5) * 2 * streamSideSpeed;
          Object.assign(p, { vx, vy, origin: { x: p.x, y: p.y, vx, vy }, owner: null, gone: false, trail: [[p.x, p.y]] });
        }
        return { neighbor, particles, own: new Set(), received: new Set(), known: new Set(), collector: new Set(), copies: [], nodes: null };
      }
      function fieldNodes(parent, owner) {
        const group = make(parent, 'g', { 'data-center': owner });
        const rings = [1, 1.5, 2].map((scale, index) => make(group, 'ellipse', { fill: index === 0 ? 'var(--viz-series-1)' : 'none', 'fill-opacity': 0.07, stroke: 'var(--viz-series-1)', 'stroke-opacity': 0.12, 'stroke-width': 1, 'data-ring': scale }));
        const center = make(group, 'circle', { r: 11, fill: 'var(--viz-series-1)', 'fill-opacity': owner === 'learner' ? 0.65 : 0.3 });
        return { group, rings, center };
      }
      function buildGravity() {
        find('alone-drawing').replaceChildren();
        find('near-drawing').replaceChildren();
        worlds.forEach((world, index) => {
          const name = index === 0 ? 'alone' : 'near';
          const drawing = choices.scene === 'overview' && index === 1 ? overviewNodes.information : find(name + '-drawing');
          drawing.replaceChildren();
          drawing.setAttribute('transform', 'translate(' + offsets[name] + ' 0)');
          const connector = make(drawing, 'line', { stroke: 'var(--viz-series-2)', 'stroke-opacity': 0.6, 'stroke-width': 1.5, 'stroke-dasharray': '4 5', 'data-sharing-path': name });
          const trails = world.particles.map(p => make(drawing, 'polyline', { fill: 'none', stroke: 'var(--foreground)', 'stroke-opacity': 0.16, 'stroke-width': 1, 'data-trail': p.id }));
          // Ghosts mark where each particle would be without any thought pulling on it.
          const pulls = world.particles.map(p => make(drawing, 'line', { stroke: 'var(--foreground)', 'stroke-width': 1, visibility: 'hidden', 'data-pull': p.id }));
          const ghosts = world.particles.map(p => make(drawing, 'circle', { r: 2.5, fill: 'none', stroke: 'var(--foreground)', 'stroke-width': 1, visibility: 'hidden', 'data-ghost': p.id }));
          const learner = fieldNodes(drawing, 'learner');
          const collector = world.neighbor ? fieldNodes(drawing, 'collector') : null;
          const particles = world.particles.map(p => make(drawing, 'circle', { r: 2.5, fill: 'var(--foreground)', 'fill-opacity': 0.55, 'data-particle': p.id }));
          const copies = make(drawing, 'g', { fill: 'var(--viz-series-2)', 'data-copy-layer': name });
          const learnerLabel = text(drawing, '学ぶ人', 0, 0);
          const collectorLabel = world.neighbor ? text(drawing, '収集者', 0, 0) : null;
          const flowLabel = text(drawing, '情報の流れ →', 12, 18, 'start');
          Object.entries({ stroke: 'var(--background)', 'stroke-width': 3, 'stroke-linejoin': 'round', 'paint-order': 'stroke' }).forEach(([key, value]) => flowLabel.setAttribute(key, String(value)));
          world.nodes ={ drawing, connector, learner, collector, trails, pulls, ghosts, particles, copies, learnerLabel, collectorLabel };
        });
      }
      function setView(name, svg, height) {
        const width = Math.max(120, Math.round(svg.getBoundingClientRect().width) || dimensions[name]);
        dimensions[name] = width;
        svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
        svg.setAttribute('height', height);
      }
      function buildReaction() {
        const drawing = find('drawing');
        drawing.replaceChildren();
        const width = dimensions.reaction;
        const height = width < 420 ? 250 : 272;
        make(drawing, 'line', { x1: 22, x2: width - 22, y1: height / 2, y2: height / 2, stroke: 'var(--border)', 'stroke-width': 1 });
        const left = make(drawing, 'circle', { r: 14, cy: height / 2, fill: 'var(--viz-series-1)', 'fill-opacity': 0.35, 'data-body': 'left' });
        const right = make(drawing, 'circle', { r: choices.rightMass === 1 ? 14 : 20, cy: height / 2, fill: 'var(--viz-series-1)', 'fill-opacity': 0.35, 'data-body': 'right' });
        const arrow = side => make(drawing, 'line', { y1: height / 2, y2: height / 2, stroke: 'var(--viz-series-1)', 'stroke-width': 2, 'marker-end': 'url(#thought-arrow)', 'data-force': side });

        } else control.addEventListener('change', () => { change(); persist(); });
      });
      function restore(saved) {
        const state = saved?.privateContent || saved;
        if (!state || typeof state !== 'object' || Array.isArray(state)) return;
        const restoredScene = normalizeScene(state.scene);
        if (restoredScene) choices.scene = restoredScene;
        if (Number.isFinite(state.strength) && state.strength >= 0.5 && state.strength <= 3 && Number.isInteger(state.strength * 2)) choices.strength = state.strength;
        if (state.rightMass === 1 || state.rightMass === 2) choices.rightMass = state.rightMass;
        for (const key of ['nearby', 'sharing', 'growth']) if (typeof state[key] === 'boolean') choices[key] = state[key];
        if (Number.isFinite(state.compactness) && state.compactness >= 0 && state.compactness <= 0.8 && Math.abs(state.compactness * 20 - Math.round(state.compactness * 20)) < 0.000000001) choices.compactness = Math.round(state.compactness * 20) / 20;
      }
      restore(window.openai?.widgetState);
      window.addEventListener('openai:set_globals', event => {
        const saved = event.detail?.globals?.widgetState;
        if (!saved) return;
        const previous = stateKey();
        restore(saved);
        if (previous !== stateKey()) reset();
      });
      reducedMotion.addEventListener('change', () => {
        if (reducedMotion.matches && running) {
          while (elapsed < duration() - 0.000001) step(Math.min(fixedStep, duration() - elapsed));
          finish();
        }
      });
      reset();
      const resizeObserver = new ResizeObserver(() => {
        const nextWidth = Math.round(root.getBoundingClientRect().width);
        if (nextWidth === measuredWidth) return;
        measuredWidth = nextWidth;
        measure();
        if (choices.scene === 'overview') {
          buildOverview();
          buildGravity();
        }
        buildReaction();
        buildRelativity();
        draw();
      });
      resizeObserver.observe(root);
    })();
  </script>
</div>
